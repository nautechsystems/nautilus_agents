- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.23.3
  hooks:
    - id: markdownlint-cli2
      name: markdownlint
      entry: markdownlint-cli2
      args:
        - --config
        - .markdownlint.jsonc
        - --fix
      files: "\\.md$"

- repo: local
  hooks:
    - id: check-markdown-tables
      name: normalize markdown table padding
      description: Pads GFM table columns to their widest cell, which MD060 does not check
      entry: python3 -B scripts/check-markdown-tables.py
      language: system
      types: [markdown]
